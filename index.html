.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.tile b{font-size:20px}.tile small{font-size:12px;color:var(--brown);min-height:18px}
.tile.done{background:var(--beige)}.tile.lock{opacity:.5}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;margin:12px 0}
.en{font-size:24px;font-weight:600;text-align:left;direction:ltr;line-height:1.4}
.ar{font-size:21px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);color:var(--brown2)}
.ar.blur{filter:blur(9px);cursor:pointer;user-select:none}
.btns{display:flex;gap:8px;margin-top:14px}
.ic{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:7px 14px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin:6px 2px}
.nav{display:flex;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:right;padding:14px;margin-bottom:9px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-size:17px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--badbg);border-color:var(--bad)}
.big{font-size:44px;font-weight:700;text-align:center;color:var(--brown2);margin:6px 0}
.msg{text-align:center;color:var(--mute);margin-bottom:12px}
